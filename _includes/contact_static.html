<!-- Contact Section -->
<section id="contact">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-left">
        <h2>Contact</h2>
        <!-- <hr class="star-primary"> -->
      </div>
    </div>
    <div class="row">
      <div class="col-lg-4 col-lg-offset-2">
        <p>For any enquiries, feel free to email me at hello@jacksoniswong.com </p>

        <p>Alternatively, you can find me on most social media!</p>

      <div class="col-lg-4 col-md-4">
        <h3>{{ site.footer.social }}</h3>
        <ul class="list-inline">
          {% for network in site.social %}
          <li>
            <a href="{{ network.url }}" class="btn-social btn-outline"><i
                class="fa-brands fa-fw fa-{{ network.title }}"></i></a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
